name: Market Pricing Sync

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Adds a "Run workflow" button in your GitHub UI for manual testing

jobs:
  sync-market:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to commit changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run market sync script
        run: |
          python scripts/sync_market_scraper.py

      - name: Commit and push updated benchmark data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_benchmarks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market benchmarks [skip ci]" && git push)